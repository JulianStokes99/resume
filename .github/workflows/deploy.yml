name: Deploy Portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    uses: ahzs645/portfolioThemes/.github/workflows/deploy-portfolio.yml@main
    with:
      cv-file: 'CV.yaml'
      # random-static => random theme on every fresh load, no theme switcher bar
      build-mode: 'random-static'
